<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>My To-Do List</h1>
    <p class="subtitle">A simple task manager built with HTML, CSS and JavaScript.</p>

    <form id="task-form">
      <input id="task-input" type="text" placeholder="Enter a task..." autocomplete="off" required>
      <button type="submit">Add Task</button>
    </form>

    <ul id="task-list" aria-label="Tasks"></ul>
    <p id="empty-message">No tasks yet. Add your first task!</p>
    <button id="clear-button" class="clear-button" type="button">Clear All</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
